name: Build Ollovin

on:
  push:
    branches: [main, feature/**]
  pull_request:

env:
  OLLovin_BUILD_NUMBER: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Validate plugin files
        run: |
          test -f main.js
          test -f manifest.json
      - name: Package plugin
        run: |
          mkdir -p dist/ollovin
          cp main.js manifest.json dist/ollovin/
          if [ -f styles.css ]; then cp styles.css dist/ollovin/; fi
          cd dist
          zip -r "Ollovin-MVP-Build-${GITHUB_RUN_NUMBER}.zip" ollovin
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ollovin-MVP-Build-${{ github.run_number }}
          path: dist/Ollovin-MVP-Build-*.zip
          if-no-files-found: error
          retention-days: 14
